pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://gitlab.torproject.org/api/v4/projects/1192/packages/maven'; content { includeGroup 'org.torproject' } }
    }
}
rootProject.name = 'Routeveil'
include ':app', ':probe', ':onionbridge'
