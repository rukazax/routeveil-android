plugins { id 'com.android.application' }
android {
    namespace 'io.github.rukazax.routeveil'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.rukazax.routeveil'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0-experimental'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = false } }
}
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation project(':onionbridge')
    testImplementation 'junit:junit:4.13.2'
}
