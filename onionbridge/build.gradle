import java.security.MessageDigest
import java.util.zip.ZipFile

plugins { id 'com.android.library' }

android {
    namespace 'org.torproject.onionmasq'
    compileSdk 36
    defaultConfig {
        minSdk 26
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations {
    nativeArtifact {
        canBeResolved = true
        canBeConsumed = false
        transitive = false
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    api 'androidx.appcompat:appcompat:1.7.1'
    api 'com.google.code.gson:gson:2.13.1'
    api 'com.netzarchitekten:IPtProxy:5.4.2'
    // This configuration is NOT on the Java compile/runtime classpath.
    nativeArtifact 'org.torproject:onionmasq:1.9.1Beta-local-release@aar'
}

// SHA256 of the original 51,388,641-byte upstream release AAR, independently
// measured with Get-FileHash. Only jni/** is used, never classes.jar/resources.
def upstreamSha256 = '89c580cc6f462fc2a346263b414d80a9c779e6966a6e4702dddd576d48444087'

abstract class ExtractPinnedNative extends DefaultTask {
    @InputFiles abstract ConfigurableFileCollection getArtifact()
    @Input abstract Property<String> getExpectedSha256()
    @Input abstract Property<Long> getExpectedSize()
    @OutputDirectory abstract DirectoryProperty getOutputDirectory()

    @TaskAction
    void extract() {
        File archive = artifact.singleFile
        if (archive.length() != expectedSize.get()) {
            throw new GradleException('Pinned Onionmasq native AAR size mismatch')
        }
        def digest = MessageDigest.getInstance('SHA-256')
        archive.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        String actual = digest.digest().encodeHex().toString()
        if (actual != expectedSha256.get()) {
            throw new GradleException('Pinned Onionmasq native AAR SHA256 mismatch')
        }
        File output = outputDirectory.get().asFile
        project.delete(output)
        output.mkdirs()
        new ZipFile(archive).withCloseable { zip ->
            for (entry in zip.entries()) {
                if (entry.directory || !entry.name.startsWith('jni/')) continue
                String relative = entry.name.substring('jni/'.length())
                File target = new File(output, relative)
                if (!target.canonicalPath.startsWith(output.canonicalPath + File.separator)) {
                    throw new GradleException('Unsafe path in pinned AAR')
                }
                target.parentFile.mkdirs()
                zip.getInputStream(entry).withCloseable { input ->
                    target.withOutputStream { out -> out << input }
                }
            }
        }
        if (!new File(output, 'arm64-v8a/libonionmasq_mobile.so').isFile()) {
            throw new GradleException('Pinned AAR has no arm64-v8a native library')
        }
    }
}

def extractNative = tasks.register('extractOnionmasqNative', ExtractPinnedNative) {
    artifact.from(configurations.nativeArtifact)
    expectedSha256.set(upstreamSha256)
    expectedSize.set(51388641L)
    outputDirectory.set(layout.buildDirectory.dir('generated/native/jni'))
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def jni = variant.sources.jniLibs
        if (jni != null) {
            jni.addGeneratedSourceDirectory(extractNative, { it.outputDirectory })
        }
    }
}
